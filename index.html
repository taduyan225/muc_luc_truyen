<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Mục lục truyện</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
}

/* khung mục lục */
.chapter-box{
    width:450px;
    margin:50px auto;
    background:white;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    padding:10px;
    max-height:300px;
    overflow-y:auto;
}

/* scroll */
.chapter-box::-webkit-scrollbar{
    width:6px;
}
.chapter-box::-webkit-scrollbar-thumb{
    background:#bbb;
    border-radius:10px;
}

/* chapter */
.chapter{
    display:flex;
    justify-content:space-between;
    padding:14px;
    border-bottom:1px solid #ddd;
    text-decoration:none;
    color:#2a9d8f;
    font-size:18px;
}
.chapter:hover{
    background:#f2f2f2;
}

/* title */
.chapter-title{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:250px;
    display:block;
}

/* date */
.date{
    color:#888;
}
</style>

</head>

<body>

<div class="chapter-box" id="chapterList"></div>

<script>
const chapters = [
{
title:"Chapter 1: Đây là tiêu đề chương rất dài để test dấu ba chấm",
date:"16-10-2025",
link:"chapter1.html"
},
{
title:"Chapter 2",
date:"12-11-2025",
link:"chapter2.html"
},
{
title:"Chapter 3",
date:"20-11-2025",
link:"chapter3.html"
},
{
title:"Chapter 4",
date:"04-12-2025",
link:"chapter4.html"
},
{
title:"Chapter 5",
date:"04-12-2025",
link:"chapter5.html"
},
{
title:"Chapter 6",
date:"29-12-2025",
link:"chapter6.html"
},
{
title:"Chapter 7",
date:"29-12-2025",
link:"chapter7.html"
},
{
title:"Chapter 8",
date:"08-01-2026",
link:"chapter8.html"
}
];

const chapterList = document.getElementById("chapterList");

chapters.forEach(chapter => {
    const a = document.createElement("a");
    a.href = chapter.link;
    a.className = "chapter";

    a.innerHTML = `
        <span class="chapter-title">${chapter.title}</span>
        <span class="date">${chapter.date}</span>
    `;

    chapterList.appendChild(a);
});
</script>

</body>
</html>
